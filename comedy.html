<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"><meta name="theme-color" content="#10151c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Night Shift"><title>Comedy Break - Night Shift</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><style>:root{--ink:#10151c;--paper:#e8e5de;--lime:#d8f37c;--coral:#ff715b;--mono:'DM Mono',monospace;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--display);overflow:hidden}.card{text-align:center;animation:pop .8s ease both}.eyebrow{color:var(--lime);font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase}.face{width:220px;height:180px;margin:26px auto;border:3px solid var(--lime);border-radius:48% 52% 45% 55%;position:relative;animation:wobble 1.2s ease-in-out infinite;background:rgba(216,243,124,.08)}.eye{position:absolute;top:54px;width:22px;height:30px;border-radius:50%;background:var(--paper);animation:blink 3s infinite}.eye::after{content:"";position:absolute;width:8px;height:12px;left:7px;top:9px;border-radius:50%;background:var(--ink)}.eye.left{left:54px}.eye.right{right:54px}.mouth{position:absolute;left:58px;right:58px;bottom:34px;height:38px;border-bottom:7px solid var(--coral);border-radius:0 0 50% 50%;animation:laugh .6s ease-in-out infinite alternate}.card h1{font-size:clamp(42px,10vw,82px);margin:0}.card p{font:12px var(--mono);color:rgba(232,229,222,.6)}a{display:inline-block;margin-top:20px;color:var(--lime);font:11px var(--mono);text-decoration:none;border:1px solid var(--lime);padding:12px 16px}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}@keyframes wobble{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-10px)}}@keyframes laugh{to{height:50px}}@keyframes blink{0%,45%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}@media(prefers-reduced-motion:reduce){.card,.face,.mouth,.eye{animation:none}}</style></head><body><main class="card"><p class="eyebrow">Comedy break</p><div class="face" aria-label="Animated laughing face"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div><h1>Gotcha.</h1><p>That answer unlocked the comedy channel.</p><a href="index.html">Back to startup ↗</a></main></body></html>
