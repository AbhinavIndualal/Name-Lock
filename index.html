<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
	<meta name="theme-color" content="#10151c">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Night Shift">
	<title>Night Shift - Enter the night</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
		rel="stylesheet">
	<style>
		:root {
			--ink: #10151c;
			--paper: #e8e5de;
			--lime: #d8f37c;
			--coral: #ff715b;
			--blue: #87a9ff;
			--mono: 'DM Mono', monospace;
			--display: 'Space Grotesk', sans-serif;
			--mouse-x: 50%;
			--mouse-y: 50%
		}

		* {
			box-sizing: border-box
		}

		html,
		body {
			margin: 0;
			min-height: 100%;
			background: var(--ink);
			color: var(--paper)
		}

		body {
			font-family: var(--display);
			overflow: hidden
		}

		.entry {
			min-height: 100vh;
			position: relative;
			isolation: isolate;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(135, 169, 255, .11), transparent 22%), var(--ink)
		}

		.entry::before {
			content: "";
			position: absolute;
			inset: 0;
			z-index: -2;
			opacity: .28;
			background-image: linear-gradient(rgba(232, 229, 222, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(232, 229, 222, .06) 1px, transparent 1px);
			background-size: 64px 64px;
			mask-image: radial-gradient(circle at center, #000, transparent 76%);
			animation: grid-drift 18s linear infinite
		}

		.entry::after {
			content: "";
			position: absolute;
			inset: 0;
			z-index: 4;
			pointer-events: none;
			opacity: .05;
			background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(232, 229, 222, .25) 4px);
			animation: scan 8s linear infinite
		}

		.orbit,
		.orbit::after {
			position: absolute;
			left: var(--mouse-x);
			top: var(--mouse-y);
			border: 1px solid rgba(216, 243, 124, .2);
			border-radius: 50%;
			pointer-events: none;
			transform: translate(-50%, -50%);
			transition: left 1.2s cubic-bezier(.2, .8, .2, 1), top 1.2s cubic-bezier(.2, .8, .2, 1)
		}

		.orbit {
			width: min(72vw, 760px);
			aspect-ratio: 1;
			animation: orbit-spin 24s linear infinite
		}

		.orbit::after {
			content: "";
			width: 72%;
			height: 72%;
			border-color: rgba(135, 169, 255, .16);
			animation: orbit-spin-reverse 16s linear infinite
		}

		.entry-content {
			width: min(720px, calc(100% - 48px));
			text-align: center;
			position: relative;
			z-index: 2;
			animation: arrive 1s cubic-bezier(.22, 1, .36, 1) both
		}

		.kicker {
			margin: 0 0 24px;
			color: var(--lime);
			font: 11px var(--mono);
			letter-spacing: .16em;
			text-transform: uppercase;
			animation: fade-up .7s ease-out .1s both
		}

		.kicker::before {
			content: "";
			display: inline-block;
			width: 7px;
			height: 7px;
			margin-right: 10px;
			border-radius: 50%;
			background: var(--lime);
			box-shadow: 0 0 18px var(--lime);
			animation: blink 2s ease-in-out infinite
		}

		h1 {
			margin: 0;
			color: var(--paper);
			font-size: clamp(64px, 13vw, 156px);
			font-weight: 600;
			letter-spacing: -.05em;
			line-height: .82;
			text-wrap: balance;
			animation: title-in 1.1s cubic-bezier(.22, 1, .36, 1) .16s both
		}

		h1 span {
			display: block;
			color: var(--lime);
			font-size: .52em;
			letter-spacing: .02em;
			line-height: 1.1;
			margin-top: 16px
		}

		.entry-copy {
			max-width: 400px;
			margin: 30px auto 34px;
			color: rgba(232, 229, 222, .58);
			font: 12px/1.7 var(--mono);
			animation: fade-up .7s ease-out .38s both
		}

		.signup {
			display: inline-flex;
			align-items: center;
			gap: 18px;
			border: 1px solid var(--lime);
			padding: 15px 18px 15px 22px;
			color: var(--ink);
			background: var(--lime);
			font: 11px var(--mono);
			letter-spacing: .08em;
			text-transform: uppercase;
			text-decoration: none;
			transition: background .25s, color .25s, transform .25s, box-shadow .25s;
			animation: fade-up .7s ease-out .5s both
		}

		.signup span {
			font-size: 18px;
			transition: transform .25s
		}

		.signup:hover,
		.signup:focus-visible {
			background: transparent;
			color: var(--lime);
			box-shadow: 0 0 30px rgba(216, 243, 124, .18);
			transform: translateY(-4px)
		}

		.signup:hover span,
		.signup:focus-visible span {
			transform: translateX(5px)
		}

		.signup:focus-visible {
			outline: 2px solid var(--paper);
			outline-offset: 5px
		}

		.footer-mark {
			position: absolute;
			left: 32px;
			bottom: 28px;
			color: rgba(232, 229, 222, .42);
			font: 10px var(--mono);
			letter-spacing: .08em;
			animation: fade-up .7s ease-out .7s both
		}

		.footer-mark strong {
			color: var(--lime);
			font-weight: 400
		}

		@keyframes arrive {
			from {
				opacity: 0;
				transform: scale(.96)
			}

			to {
				opacity: 1;
				transform: scale(1)
			}
		}

		@keyframes title-in {
			from {
				opacity: 0;
				filter: blur(12px);
				transform: translateY(20px) scale(.96)
			}

			to {
				opacity: 1;
				filter: blur(0);
				transform: translateY(0) scale(1)
			}
		}

		@keyframes fade-up {
			from {
				opacity: 0;
				transform: translateY(14px)
			}

			to {
				opacity: 1;
				transform: translateY(0)
			}
		}

		@keyframes blink {

			0%,
			100% {
				opacity: .35;
				transform: scale(.8)
			}

			50% {
				opacity: 1;
				transform: scale(1.2)
			}
		}

		@keyframes orbit-spin {
			to {
				transform: translate(-50%, -50%) rotate(360deg)
			}
		}

		@keyframes orbit-spin-reverse {
			to {
				transform: translate(-50%, -50%) rotate(-360deg)
			}
		}

		@keyframes grid-drift {
			to {
				background-position: 64px 64px
			}
		}

		@keyframes scan {
			to {
				transform: translateY(8px)
			}
		}

		@media(max-width:600px) {
			.entry-content {
				width: min(100% - 32px, 520px)
			}

			.orbit {
				width: 116vw
			}

			.footer-mark {
				left: 16px;
				bottom: 18px
			}

			h1 {
				font-size: clamp(62px, 20vw, 110px)
			}
		}

		@media(prefers-reduced-motion:reduce) {

			.entry::before,
			.entry::after,
			.orbit,
			.orbit::after,
			.entry-content,
			.kicker,
			.kicker::before,
			h1,
			.entry-copy,
			.signup,
			.footer-mark {
				animation: none
			}

			.orbit {
				transition: none
			}
		}
	</style>
</head>

<body>
	<main class="entry" id="entry">
		<div class="orbit" aria-hidden="true"></div>
		<section class="entry-content" aria-labelledby="entry-title">
			<p class="kicker">Studio access</p>
			<h1 id="entry-title">Make your<span>Dream Username.</span></h1>
			<p class="entry-copy">A small identity for the hours when the ordinary gets interesting.</p>
			<a class="signup" href="username.html">Create your username <span aria-hidden="true">↗</span></a>
		</section>
		<p class="footer-mark"><strong>NS—01</strong> / identity lab</p>
	</main>
	<script>
		const entry = document.querySelector('#entry');
		const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
		const moveLight = (event) => {
			if (reduceMotion.matches) return;
			const x = (event.clientX / window.innerWidth) * 100;
			const y = (event.clientY / window.innerHeight) * 100;
			entry.style.setProperty('--mouse-x', `${x}%`);
			entry.style.setProperty('--mouse-y', `${y}%`);
		};
		window.addEventListener('pointermove', moveLight, { passive: true });
		window.addEventListener('touchmove', (e) => {
			if (e.touches && e.touches[0]) moveLight(e.touches[0]);
		}, { passive: true });
	</script>
</body>

</html>
