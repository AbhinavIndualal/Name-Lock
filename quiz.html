<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
	<meta name="theme-color" content="#10151c">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Night Shift">
	<title>Studio Quiz - Night Shift</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.svg">
	<style>
		:root{--ink:#10151c;--paper:#e8e5de;--lime:#d8f37c;--coral:#ff715b;--blue:#87a9ff;--mono:'DM Mono',monospace;--display:'Space Grotesk',sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}body{font-family:var(--display)}.quiz-page{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(216,243,124,.12),transparent 34%),var(--ink)}.quiz-card{width:min(560px,100%);text-align:center;animation:rise .8s cubic-bezier(.22,1,.36,1) both}.eyebrow{color:var(--lime);font:10px var(--mono);letter-spacing:.16em;text-transform:uppercase}.quiz-card h1{margin:14px 0;font-size:clamp(44px,9vw,82px);line-height:.88}.quiz-card h1 span{display:block;color:var(--lime)}.question{margin:26px 0 18px;font:13px/1.6 var(--mono)}.answers{display:grid;gap:8px;text-align:left}.answers button{border:1px solid rgba(232,229,222,.25);background:rgba(232,229,222,.04);color:var(--paper);padding:13px;font:11px var(--mono);cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.answers button:hover{border-color:var(--lime);transform:translateX(4px)}.answers button.correct{border-color:var(--lime);background:rgba(216,243,124,.18);color:var(--lime)}.answers button.wrong{border-color:var(--coral);color:var(--coral)}.quiz-status{min-height:18px;color:rgba(232,229,222,.6);font:10px var(--mono)}.quiz-status.success{color:var(--lime)}.back{display:inline-block;margin-top:24px;color:rgba(232,229,222,.45);font:10px var(--mono);text-decoration:none}.back:hover{color:var(--lime)}@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.quiz-card{animation:none}}
	</style>
</head>

<body>
	<main class="quiz-page">
		<section class="quiz-card" aria-labelledby="quiz-title">
			<p class="eyebrow">Special feature / 01</p>
			<h1 id="quiz-title">Studio<span>signal quiz.</span></h1>
			<p class="question">Which idea best describes the Night Shift studio?</p>
			<div class="answers" id="answers">
				<button type="button" data-route="comedy.html">A place for ordinary routines</button>
				<button type="button" data-route="car.html">A space for unusual identities and experiments</button>
				<button type="button" data-route="dumb.html">A quiet archive with no surprises</button>
			</div>
			<p class="quiz-status" id="quiz-status" aria-live="polite">Choose an answer to unlock the feature.</p>
			<a class="back" href="game.html">Back to the puzzle</a>
		</section>
	</main>
	<script>
		const status = document.querySelector('#quiz-status');
		document.querySelectorAll('.answers button').forEach(button => button.addEventListener('click', () => { window.location.href = button.dataset.route; }));
	</script>
</body>

</html>
