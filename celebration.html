<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
	<meta name="theme-color" content="#10151c">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Night Shift">
	<title>Identity Unlocked - Night Shift</title>
	<link rel="manifest" href="manifest.json">
	<link rel="icon" type="image/svg+xml" href="icon.svg">
	<link rel="apple-touch-icon" href="icon.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		:root{--ink:#10151c;--paper:#e8e5de;--lime:#d8f37c;--coral:#ff715b;--blue:#87a9ff;--mono:'DM Mono',monospace;--display:'Space Grotesk',sans-serif;--x:50%;--y:50%}
		*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper)}body{font-family:var(--display);overflow:hidden}
		.celebration{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at var(--x) var(--y),rgba(216,243,124,.2),transparent 18%),radial-gradient(circle at 50% 50%,rgba(135,169,255,.1),transparent 42%),var(--ink);transition:background-position .4s}
		.celebration::before{content:"";position:absolute;inset:-50%;z-index:-3;background:conic-gradient(from 0deg,transparent 0 10%,rgba(216,243,124,.16) 12%,transparent 17% 32%,rgba(135,169,255,.15) 35%,transparent 40% 63%,rgba(255,113,91,.12) 66%,transparent 71%);animation:spin 14s linear infinite}
		.celebration::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(110deg,transparent 20%,rgba(232,229,222,.12) 50%,transparent 80%);transform:translateX(-100%);animation:sweep 5s ease-in-out 1.3s infinite}
		.ring{position:absolute;left:50%;top:50%;width:min(75vw,780px);aspect-ratio:1;border:1px solid rgba(216,243,124,.2);border-radius:50%;transform:translate(-50%,-50%);animation:ring-breathe 4s ease-in-out infinite}.ring::before,.ring::after{content:"";position:absolute;inset:9%;border:1px solid rgba(135,169,255,.18);border-radius:50%;animation:ring-rotate 12s linear infinite}.ring::after{inset:22%;border-color:rgba(255,113,91,.2);animation-direction:reverse;animation-duration:8s}
		.starfield{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--lime) 0 1px,transparent 1.5px),radial-gradient(circle,var(--blue) 0 1px,transparent 1.5px);background-size:83px 97px,137px 121px;background-position:20px 30px,70px 10px;opacity:.34;animation:stars 16s linear infinite}
		.celebration-content{position:relative;z-index:2;width:min(760px,calc(100% - 40px));text-align:center;animation:arrival 1.2s cubic-bezier(.22,1,.36,1) both}.burst{width:96px;height:96px;margin:0 auto 30px;border:1px solid var(--lime);border-radius:50%;display:grid;place-items:center;color:var(--lime);font-size:44px;box-shadow:0 0 42px rgba(216,243,124,.3);animation:burst-pop 1s cubic-bezier(.22,1,.36,1) .2s both,burst-pulse 2s ease-in-out 1.2s infinite}.eyebrow{margin:0 0 20px;color:var(--lime);font:11px var(--mono);letter-spacing:.2em;text-transform:uppercase;animation:rise .8s ease-out .35s both}.celebration h1{margin:0;font-size:clamp(58px,12vw,140px);line-height:.8;letter-spacing:-.06em;animation:headline 1.1s cubic-bezier(.22,1,.36,1) .45s both}.celebration h1 span{display:block;color:var(--lime);font-size:.48em;letter-spacing:.02em;margin-top:18px}.celebration-copy{max-width:460px;margin:30px auto 0;color:rgba(232,229,222,.6);font:12px/1.7 var(--mono);animation:rise .8s ease-out .7s both}.status{display:inline-flex;align-items:center;gap:10px;margin-top:30px;color:var(--paper);font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;animation:rise .8s ease-out .9s both}.status i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime);animation:blink 1.4s ease-in-out infinite}.return{display:block;margin:30px auto 0;width:max-content;color:rgba(232,229,222,.45);font:10px var(--mono);text-decoration:none;animation:rise .8s ease-out 1.1s both}.return:hover{color:var(--lime)}
		@keyframes spin{to{transform:rotate(360deg)}}@keyframes ring-rotate{to{transform:rotate(360deg)}}@keyframes ring-breathe{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.88)}50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}}@keyframes stars{to{background-position:103px 127px,207px 131px}}@keyframes sweep{0%,35%{transform:translateX(-100%)}65%,100%{transform:translateX(100%)}}@keyframes arrival{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@keyframes burst-pop{from{opacity:0;transform:scale(.2) rotate(-90deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes burst-pulse{0%,100%{box-shadow:0 0 24px rgba(216,243,124,.2)}50%{box-shadow:0 0 70px rgba(216,243,124,.5)}}@keyframes headline{from{opacity:0;filter:blur(16px);transform:translateY(26px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
		@media(max-width:600px){.celebration h1{font-size:clamp(56px,18vw,100px)}.ring{width:118vw}.celebration-content{width:calc(100% - 30px)}}
		@media(prefers-reduced-motion:reduce){.celebration::before,.celebration::after,.ring,.ring::before,.ring::after,.starfield,.celebration-content,.burst,.eyebrow,.celebration h1,.celebration-copy,.status,.return{animation:none}}
</style>
	<style>.game-link{display:inline-block;margin:30px 4px 0;border:1px solid var(--lime);padding:11px 15px;color:var(--lime);font:10px var(--mono);text-decoration:none;animation:rise .8s ease-out 1.1s both}.game-link:hover{color:var(--paper)}</style>
</head>

<body>
	<main class="celebration" id="celebration">
		<div class="starfield" aria-hidden="true"></div>
		<div class="ring" aria-hidden="true"></div>
		<section class="celebration-content" aria-labelledby="celebration-title">
			<div class="burst" aria-hidden="true">✓</div>
			<p class="eyebrow">Identity sequence complete</p>
			<h1 id="celebration-title">You are<span>unlocked.</span></h1>
			<p class="celebration-copy">Your username and password are ready. The night is yours to shape.</p>
			<div class="status"><i></i> Access granted</div>
			<a class="game-link" href="game.html">Continue to studio game ↗</a>
			<a class="return" href="index.html">Return to the beginning ↗</a>
		</section>
	</main>
	<script>
		const celebration = document.querySelector('#celebration');
		window.addEventListener('pointermove', event => {
			celebration.style.setProperty('--x', `${event.clientX / innerWidth * 100}%`);
			celebration.style.setProperty('--y', `${event.clientY / innerHeight * 100}%`);
		}, { passive: true });
	</script>
</body>

</html>
